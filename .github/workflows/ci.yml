# Builds and tests OpenMM2 on Linux (GCC, Clang), Windows (MSVC) and as a
# MinGW-w64 cross build, and packages the results. Tests that need the
# original game files skip themselves (OPENMM2_GAME_DATA is never set here),
# and no game data is ever downloaded or cached.
#
# Pushing a tag v* also publishes the packages as a GitHub release.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    # Arch Linux tracks current GCC/Clang/SDL3, which the C++23 code base needs
    # (std::print, std::expected, ...). Ubuntu 24.04's toolchains are too old.
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            preset: linux-gcc-release
            package: true
          - compiler: clang
            preset: linux-clang-release
            package: false
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja gcc clang lld \
            shaderc glslang sdl3 gtest mesa libglvnd vulkan-icd-loader \
            appstream desktop-file-utils

      - uses: actions/checkout@v7

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: |
            out/build/${{ matrix.preset }}/_deps/*-src
            out/build/${{ matrix.preset }}/_deps/*-subbuild
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Validate desktop metadata
        if: matrix.package
        run: |
          desktop-file-validate packaging/linux/io.github.lowlevelmetal.OpenMM2.desktop
          appstreamcli validate --no-net packaging/linux/io.github.lowlevelmetal.OpenMM2.metainfo.xml

      - name: Package
        if: matrix.package
        run: cpack --preset linux-release

      - name: Upload package
        if: matrix.package
        uses: actions/upload-artifact@v7
        with:
          name: openmm2-linux-x86_64
          path: |
            out/build/${{ matrix.preset }}/OpenMM2-*.tar.gz
            out/build/${{ matrix.preset }}/OpenMM2-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK (shader compiler)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      - name: Install Ninja and NSIS if missing
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis) -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: |
            out/build/windows-msvc/_deps/*-src
            out/build/windows-msvc/_deps/*-subbuild
          key: deps-windows-msvc-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc-release

      - name: Test
        run: ctest --preset windows-msvc-release

      - name: Build installer
        run: cmake --build --preset windows-msvc-release --target package_installer

      - name: Build portable ZIP
        run: cpack --preset windows-portable

      # The runner has Visual Studio, so a missing runtime DLL would never fail
      # a test here. Every VC++ runtime DLL the package's programs and DLLs
      # import must be in the package, and every other DLL there or in Windows.
      - name: Check the package's DLL imports
        shell: pwsh
        run: |
          $zip = Get-ChildItem out/build/windows-msvc -Filter 'OpenMM2-*-portable.zip' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'portable-check'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName -DestinationPath $dir
          $bad = @()
          foreach ($exe in Get-ChildItem $dir -Recurse -Include *.exe, *.dll) {
            $here = $exe.DirectoryName
            $deps = (dumpbin /nologo /dependents $exe.FullName) |
              ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
            foreach ($dll in $deps) {
              $packaged = Test-Path (Join-Path $here $dll)
              $runtime = $dll -match '^(vcruntime|msvcp|concrt|vccorlib)'
              $system = (Test-Path (Join-Path "$env:WINDIR\System32" $dll)) -or $dll -match '^(api|ext)-ms-'
              Write-Host "$($exe.Name): $dll packaged=$packaged"
              if (-not $packaged -and ($runtime -or -not $system)) { $bad += "$($exe.Name) imports $dll, which the package does not ship" }
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: openmm2-windows-x64
          path: |
            out/build/windows-msvc/OpenMM2-*-setup.exe
            out/build/windows-msvc/OpenMM2-*-portable.zip
            out/build/windows-msvc/OpenMM2-*-portable.zip.sha256
          if-no-files-found: error

  mingw:
    name: Windows cross build (MinGW-w64)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        # Wine runs the determinism tests (the toolchain file makes it the
        # tests' emulator when it is installed at configure time).
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja mingw-w64-gcc shaderc glslang wine

      - uses: actions/checkout@v7

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: |
            out/build/mingw-cross-release/_deps/*-src
            out/build/mingw-cross-release/_deps/*-subbuild
          key: deps-mingw-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset mingw-cross-release

      - name: Build
        run: cmake --build --preset mingw-cross-release

      # The simulation must give the same bits as the Linux and MSVC builds
      # (docs/physics.md, "The same results on every platform"). Only these
      # tests: the native jobs run the rest.
      - name: Test determinism under Wine
        env:
          # A prefix of the container's own user (Wine refuses one it does
          # not own), without the Mono and Gecko installers.
          WINEPREFIX: /tmp/wineprefix
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          wineboot --init
          ctest --preset mingw-cross-release -R '^Determinism[.]'

      - name: Package
        run: cpack --preset mingw-portable

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openmm2-windows-x64-mingw
          path: out/build/mingw-cross-release/OpenMM2-*-portable.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, mingw]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Release the MSVC build for Windows; the MinGW build is a portability check
      # (and its ZIP has the same file name).
      - uses: actions/download-artifact@v8
        with:
          name: openmm2-windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: openmm2-linux-x86_64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/OpenMM2-*-setup.exe
            dist/OpenMM2-*-windows-*-portable.zip
            dist/OpenMM2-*-linux-*.tar.gz
            dist/*.sha256
